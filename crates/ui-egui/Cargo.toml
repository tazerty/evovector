[package]
name = "evovector-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvoVector egui frontend (menus, panels, tools and canvas); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
evo-ui = { workspace = true }
evovector-geom = { workspace = true }
evovector-color = { workspace = true }
evovector-doc = { workspace = true }
evovector-brush = { workspace = true }
evovector-render = { workspace = true }
evovector-text = { workspace = true }
evovector-tools = { workspace = true }
evovector-engine = { workspace = true }
evovector-svg = { workspace = true }
evovector-effects = { workspace = true }
evovector-three-d = { workspace = true }
evovector-plugins = { workspace = true }
evovector-pdf = { workspace = true }
evovector-cad = { workspace = true }
evovector-eps = { workspace = true }
evovector-format = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
evovector-testkit = { workspace = true }
wat = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
