[package]
name = "evovector-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvoVector Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
evovector-geom = { workspace = true }
evovector-color = { workspace = true }
evovector-doc = { workspace = true }
evovector-effects = { workspace = true }
evovector-brush = { workspace = true }
evovector-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
evovector-metafile = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
evovector-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
evovector-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }

[dev-dependencies]
evovector-testkit = { workspace = true }
