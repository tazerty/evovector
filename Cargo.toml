[workspace]
exclude = ["vendor/evo-libs"]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/evovector", "apps/evovector-cli", "xtask"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/tazerty/evovector"

[workspace.dependencies]
evo-print = { path = "vendor/evo-libs/evo-print" }
evo-ui = { path = "vendor/evo-libs/evo-ui", features = ["serde"] }
# internal
evovector-geom = { path = "crates/geom" }
evovector-color = { path = "crates/color" }
evovector-doc = { path = "crates/doc" }
evovector-pathops = { path = "crates/pathops" }
evovector-brush = { path = "crates/brush" }
evovector-trace = { path = "crates/trace" }
evovector-text = { path = "crates/text" }
evovector-effects = { path = "crates/effects" }
evovector-three-d = { path = "crates/three-d" }
evovector-render = { path = "crates/render" }
evovector-svg = { path = "crates/svg" }
evovector-pdf = { path = "crates/pdf" }
evovector-format = { path = "crates/format" }
evovector-tools = { path = "crates/tools" }
evovector-engine = { path = "crates/engine" }
evovector-ui-egui = { path = "crates/ui-egui" }
evovector-mcp = { path = "crates/mcp" }
evovector-testkit = { path = "crates/testkit" }
evovector-cad = { path = "crates/cad" }
evovector-eps = { path = "crates/eps" }
evovector-metafile = { path = "crates/metafile" }
evovector-plugins = { path = "crates/plugins" }
evovector-affinity = { path = "crates/affinity" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
peniko = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
crc32fast = "1.5"
# tests: a TCP port bound without listening (connections to it are refused)
socket2 = "0.6"
# Sandboxed WebAssembly plug-ins: a pure-Rust interpreter (MIT OR Apache-2.0) that builds for wasm32
# too. Without `wat` (text parsing is test-only) and memory64; `validate` keeps full module
# validation on; the portable dispatcher can't overflow the host stack on long-running modules.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
# Tests: WebAssembly text -> binary for the plug-in fixtures (Apache-2.0 WITH LLVM-exception).
wat = "1.228"

# rendering / formats
vello_cpu = { version = "0.2", features = ["f32_pipeline"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
usvg = "0.48"
krilla = "0.8"
skrifa = "0.47"
harfrust = "0.13"
linesweeper = "0.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Zstandard decoder (pure Rust, builds for wasm32 too): the editing copy an EPS carries of its art.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }
# CMYK image samples (evovector-doc's cmyk module): the image crate's own TIFF and JPEG
# decoders, read directly (the image crate converts CMYK to RGB).
tiff = "0.11"
zune-jpeg = "0.5"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
clipboard-win = "5.4"
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
# EvoVector never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
