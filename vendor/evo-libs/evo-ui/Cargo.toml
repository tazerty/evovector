[package]
name = "evo-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "vendor/evo-libs"
rust-version = "1.95"
description = "Reusable egui controls and icon catalogs for Evo frontends"

[dependencies]
egui = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

